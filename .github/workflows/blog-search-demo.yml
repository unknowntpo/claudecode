name: Blog Search Demo CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-demo:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: blogdb
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpass
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Elasticsearch
        run: |
          docker run -d \
            --name elasticsearch \
            -p 19200:9200 \
            -p 19300:9300 \
            -e "discovery.type=single-node" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            -e "xpack.security.enabled=false" \
            -e "xpack.security.enrollment.enabled=false" \
            docker.elastic.co/elasticsearch/elasticsearch:8.11.0

      - name: Wait for Elasticsearch to be ready
        run: |
          echo "Waiting for Elasticsearch to be ready..."
          max_attempts=30
          attempt=0
          until curl -f http://localhost:19200/_cluster/health || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Elasticsearch not ready yet..."
            sleep 5
            attempt=$((attempt+1))
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Elasticsearch failed to start"
            docker logs elasticsearch
            exit 1
          fi

          echo "Elasticsearch is ready!"
          curl http://localhost:19200/_cluster/health

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Verify services are running
        run: |
          echo "Checking PostgreSQL..."
          pg_isready -h localhost -p 15432 -U bloguser

          echo "Checking Elasticsearch..."
          curl -f http://localhost:19200/_cluster/health

          echo "All services are ready!"

      - name: Run blog search demo
        id: run_demo
        run: |
          echo "Running blog search demo..."
          uv run blog_search_demo.py 2>&1 | tee demo_output.txt
          echo "Demo completed successfully!"
        continue-on-error: false

      - name: Create demo summary
        if: always()
        run: |
          echo "# Blog Search Demo Results" > demo_summary.md
          echo "" >> demo_summary.md
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> demo_summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> demo_summary.md
          echo "**Commit:** ${{ github.sha }}" >> demo_summary.md
          echo "" >> demo_summary.md
          echo "## Demo Output" >> demo_summary.md
          echo "" >> demo_summary.md
          echo '```' >> demo_summary.md
          cat demo_output.txt >> demo_summary.md
          echo '```' >> demo_summary.md

      - name: Upload demo output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-search-demo-output-${{ github.run_number }}
          path: |
            demo_output.txt
            demo_summary.md
          retention-days: 30

      - name: Display Elasticsearch logs (on failure)
        if: failure()
        run: |
          echo "=== Elasticsearch Logs ==="
          docker logs elasticsearch

      - name: Display service status (on failure)
        if: failure()
        run: |
          echo "=== Docker Containers ==="
          docker ps -a

          echo "=== PostgreSQL Status ==="
          pg_isready -h localhost -p 15432 -U bloguser || true

          echo "=== Elasticsearch Status ==="
          curl -f http://localhost:19200/_cluster/health || true

      - name: Comment PR with demo results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('demo_output.txt', 'utf8');
            const truncatedOutput = output.length > 4000
              ? output.substring(0, 4000) + '\n\n... (output truncated, see artifacts for full output)'
              : output;

            const body = `## 🔍 Blog Search Demo Results

            **Status:** ${{ job.status }}
            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            <details>
            <summary>Demo Output</summary>

            \`\`\`
            ${truncatedOutput}
            \`\`\`

            </details>

            📦 [Download full output artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # Optional: Run with different Python versions
  compatibility-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: blogdb
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpass
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Elasticsearch
        run: |
          docker run -d \
            --name elasticsearch \
            -p 19200:9200 \
            -e "discovery.type=single-node" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            -e "xpack.security.enabled=false" \
            docker.elastic.co/elasticsearch/elasticsearch:8.11.0

      - name: Wait for Elasticsearch
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:19200/_cluster/health; then
              echo "Elasticsearch is ready!"
              break
            fi
            echo "Waiting for Elasticsearch... ($i/30)"
            sleep 5
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run demo (quick test)
        run: |
          timeout 120s uv run blog_search_demo.py || exit 1
