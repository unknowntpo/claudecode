name: Manual Demo Run

on:
  workflow_dispatch:
    inputs:
      num_posts:
        description: 'Number of blog posts to generate'
        required: false
        default: '100'
        type: string
      search_queries:
        description: 'Custom search queries (comma-separated)'
        required: false
        default: 'python programming,machine learning AI,docker kubernetes,web development'
        type: string

jobs:
  manual-demo:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: blogdb
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpass
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Elasticsearch and Kibana
        run: |
          # Start Elasticsearch
          docker run -d \
            --name elasticsearch \
            -p 19200:9200 \
            -p 19300:9300 \
            -e "discovery.type=single-node" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            -e "xpack.security.enabled=false" \
            -e "xpack.security.enrollment.enabled=false" \
            docker.elastic.co/elasticsearch/elasticsearch:8.11.0

      - name: Wait for services
        run: |
          echo "Waiting for Elasticsearch..."
          for i in {1..30}; do
            if curl -s http://localhost:19200/_cluster/health; then
              echo "✓ Elasticsearch is ready!"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 5
          done

          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 15432 -U bloguser; do
            echo "  Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✓ PostgreSQL is ready!"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Test database connections
        run: |
          echo "Testing connections..."
          uv run python -c "
          import psycopg2
          from elasticsearch import Elasticsearch

          # Test PostgreSQL
          conn = psycopg2.connect(host='localhost', port=15432, database='blogdb', user='bloguser', password='blogpass')
          print('✓ PostgreSQL connection successful')
          conn.close()

          # Test Elasticsearch
          es = Elasticsearch(['http://localhost:19200'])
          health = es.cluster.health()
          print('✓ Elasticsearch connection successful')
          print('✓ Cluster status:', health['status'])
          "

      - name: Run blog search demo
        run: |
          echo "Running demo with ${{ inputs.num_posts }} blog posts"
          echo "Search queries: ${{ inputs.search_queries }}"

          # Run the demo and capture output with timestamps
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Starting demo..." | tee demo_output.txt
          uv run python blog_search_demo.py 2>&1 | tee -a demo_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Demo completed with exit code: $exit_code" | tee -a demo_output.txt

          if [ $exit_code -ne 0 ]; then
            echo "Demo failed!"
            exit $exit_code
          fi

      - name: Create detailed report
        if: always()
        run: |
          cat > demo_report.md << 'EOF'
          # Blog Search Demo Report

          ## Execution Details

          - **Workflow:** Manual Demo Run
          - **Run Number:** #${{ github.run_number }}
          - **Triggered By:** @${{ github.actor }}
          - **Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}

          ## Configuration

          - **Number of Posts:** ${{ inputs.num_posts }}
          - **Search Queries:** ${{ inputs.search_queries }}

          ## System Information

          - **Runner OS:** Ubuntu Latest
          - **PostgreSQL:** 15 (Port 15432)
          - **Elasticsearch:** 8.11.0 (Port 19200)
          - **Python:** 3.11 with uv package manager

          ## Demo Output

          ```
          EOF

          cat demo_output.txt >> demo_report.md

          cat >> demo_report.md << 'EOF'
          ```

          ## Service Health

          ### PostgreSQL
          ```
          EOF

          pg_isready -h localhost -p 15432 -U bloguser >> demo_report.md || echo "PostgreSQL not responding" >> demo_report.md

          cat >> demo_report.md << 'EOF'
          ```

          ### Elasticsearch
          ```
          EOF

          curl -s http://localhost:19200/_cluster/health?pretty >> demo_report.md || echo "Elasticsearch not responding" >> demo_report.md

          cat >> demo_report.md << 'EOF'
          ```

          ---
          *Generated by GitHub Actions*
          EOF

      - name: Get Elasticsearch stats
        if: always()
        run: |
          echo "Elasticsearch Index Stats:" > es_stats.txt
          curl -s "http://localhost:19200/blog_posts/_stats?pretty" >> es_stats.txt || echo "Could not retrieve stats" >> es_stats.txt

      - name: Get sample data
        if: always()
        run: |
          echo "Sample Blog Posts from Elasticsearch:" > sample_data.json
          curl -s "http://localhost:19200/blog_posts/_search?size=5&pretty" >> sample_data.json || echo "Could not retrieve sample data" >> sample_data.json

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts
          mv demo_output.txt artifacts/
          mv demo_report.md artifacts/
          mv es_stats.txt artifacts/
          mv sample_data.json artifacts/

          # Create a timestamp file
          echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > artifacts/timestamp.txt
          echo "Run ID: ${{ github.run_id }}" >> artifacts/timestamp.txt
          echo "Run Number: ${{ github.run_number }}" >> artifacts/timestamp.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ github.run_number }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 90

      - name: Create workflow summary
        if: always()
        run: |
          echo "## 🎯 Blog Search Demo Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Posts Generated:** ${{ inputs.num_posts }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Search Queries:** ${{ inputs.search_queries }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Status" >> $GITHUB_STEP_SUMMARY

          if pg_isready -h localhost -p 15432 -U bloguser; then
            echo "- ✅ PostgreSQL: Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ PostgreSQL: Unhealthy" >> $GITHUB_STEP_SUMMARY
          fi

          if curl -f http://localhost:19200/_cluster/health; then
            echo "- ✅ Elasticsearch: Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Elasticsearch: Unhealthy" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The following files have been uploaded as artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`demo_output.txt\` - Raw demo output" >> $GITHUB_STEP_SUMMARY
          echo "- \`demo_report.md\` - Formatted report" >> $GITHUB_STEP_SUMMARY
          echo "- \`es_stats.txt\` - Elasticsearch statistics" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample_data.json\` - Sample indexed data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          docker stop elasticsearch || true
          docker rm elasticsearch || true
