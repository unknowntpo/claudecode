# Single-node KRaft broker with the streams rebalance protocol (KIP-1071, early access in 4.1).
services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # enable the streams group protocol
      KAFKA_UNSTABLE_API_VERSIONS_ENABLE: "true"
      KAFKA_UNSTABLE_FEATURE_VERSIONS_ENABLE: "true" # streams.version=1 is finalized at format time
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,streams
      # short timeouts so rebalances are easy to watch
      KAFKA_GROUP_STREAMS_HEARTBEAT_INTERVAL_MS: 2000
      KAFKA_GROUP_STREAMS_MIN_HEARTBEAT_INTERVAL_MS: 1000
      KAFKA_GROUP_STREAMS_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_STREAMS_MIN_SESSION_TIMEOUT_MS: 6000
